{{ block title }}{{ endblock }}

{{ block content }}

<style>
  body { font-size: 22px; }
  .panel {
    max-width: 760px;
    margin: 8vh auto 0 auto;
    padding: 2.5rem;
    text-align: center;
  }
  .big {
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 1.2rem;
  }
  .line {
    font-size: 1.2rem;
    margin: 0.7rem 0;
  }
  .pid {
    display: inline-block;
    margin-top: 0.4rem;
    padding: 0.35rem 0.6rem;
    border-radius: 8px;
    background: #f3f3f3;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    font-size: 1rem;
  }
</style>

<div class="panel">
  <div class="big">This is the end of the game</div>

  <div class="line">
    Your participant ID:
    <div class="pid">{{ participant_code }}</div>
  </div>

  <div class="line">Total points: <strong>{{ total_points }}</strong></div>
</div>

{{ endblock }}
